---
# Arch: ставим дистрибутивный пакет extra/prometheus-ipmi-exporter.
# Ветвление «пакет или tarball» задаётся НЕ здесь, а выбором файла
# vars/<OS>.yml: в Debian те же переменные указывают на собственную
# сборку. Раньше тут стоял блок выражений с ipmi_exporter_use_distro_package
# — он дублировал диспетчеризацию по ОС и убран 13.09.2026.
# Ставить пакет или качать tarball по-прежнему решает install_package.
ipmi_exporter_dest: '/opt/ipmi_exporter'
ipmi_exporter_conf_dest: '/etc/prometheus'
ipmi_exporter_yaml_dest: '/etc/prometheus/ipmi-exporter.yml'
ipmi_exporter_options_dest: '/etc/prometheus/ipmi-exporter.env'
ipmi_exporter_options_env_var: 'IPMI_EXPORTER_ARGS'
ipmi_exporter_bin: '/usr/bin/ipmi_exporter'
ipmi_exporter_service: 'prometheus-ipmi-exporter'
ipmi_exporter_package: 'prometheus-ipmi-exporter'
ipmi_exporter_packages_deps:
  - 'unzip'
  - 'tar'
  - 'freeipmi'
